name: CI

on:
  push:

  pull_request:

jobs:
  quality:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: employee_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Static analysis
        run: go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build migration image
        run: docker build -f Dockerfile.migrate -t backend-api-migrate:ci .

      - name: Run database migrations
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/migrations:/app/migrations:ro" \
            backend-api-migrate:ci \
            -path=/app/migrations \
            -database='postgres://postgres:postgrespassword@localhost:5434/employee_db?sslmode=disable' \
            up

      - name: Tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/api

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check
        run: govulncheck ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        shell: bash
        run: |
          image_name="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${image_name}" >> "$GITHUB_ENV"

      - name: Prepare development TLS certificates
        shell: bash
        run: |
          mkdir -p certs

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/key.pem \
            -out certs/cert.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          chmod 600 certs/key.pem
          chmod 644 certs/cert.pem

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"
