openapi: 3.0.3

info:
  title: Employee API
  description: REST API for managing employees
  version: 1.0.0

servers:
  - url: https://localhost:8443
    description: Local HTTPS server

tags:
  - name: Employees
    description: Employee management
  - name: Health
    description: Server health

paths:

  # =========================================================
  # GET ALL EMPLOYEES
  # =========================================================

  /api/v1/employees:
    get:
      tags:
        - Employees

      summary: Get employees
      description: Get a paginated list of employees with optional filtering and sorting.

      parameters:

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: page_size
          in: query
          required: false
          description: Number of employees per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - name: name
          in: query
          required: false
          description: Filter employees by name
          schema:
            type: string

        - name: email
          in: query
          required: false
          description: Filter employees by email
          schema:
            type: string

        - name: sort_by
          in: query
          required: false
          description: Field used for sorting
          schema:
            type: string
            enum:
              - id
              - name
              - email
            default: id

        - name: sort_order
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc

      responses:

        "200":
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"

        "406":
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


    # =======================================================
    # CREATE EMPLOYEE
    # =======================================================

    post:
      tags:
        - Employees

      summary: Create employee
      description: Create a new employee.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"

      responses:

        "201":
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"

        "400":
          description: Invalid employee data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "406":
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # GET EMPLOYEE BY ID
  # =========================================================

  /api/v1/employees/{id}:

    get:
      tags:
        - Employees

      summary: Get employee
      description: Get a single employee by ID.

      parameters:

        - name: id
          in: path
          required: true
          description: Employee ID
          schema:
            type: integer
            minimum: 1

      responses:

        "200":
          description: Employee retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"

        "400":
          description: Invalid employee ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "406":
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


    # =======================================================
    # UPDATE EMPLOYEE
    # =======================================================

    put:
      tags:
        - Employees

      summary: Update employee
      description: Update an existing employee.

      parameters:

        - name: id
          in: path
          required: true
          description: Employee ID
          schema:
            type: integer
            minimum: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"

      responses:

        "200":
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"

        "400":
          description: Invalid employee data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "406":
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


    # =======================================================
    # DELETE EMPLOYEE
    # =======================================================

    delete:
      tags:
        - Employees

      summary: Delete employee
      description: Delete an employee by ID.

      parameters:

        - name: id
          in: path
          required: true
          description: Employee ID
          schema:
            type: integer
            minimum: 1

      responses:

        "204":
          description: Employee deleted successfully

        "400":
          description: Invalid employee ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "406":
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  # =========================================================
  # HEALTH
  # =========================================================

  /health:

    get:
      tags:
        - Health

      summary: Health check
      description: Check whether the API server is running.

      responses:

        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"


# ===========================================================
# COMPONENTS
# ===========================================================

components:

  schemas:

    # -------------------------------------------------------
    # CREATE REQUEST
    # -------------------------------------------------------

    CreateEmployeeRequest:
      type: object
      required:
        - name
        - email

      properties:

        name:
          type: string
          example: Ali

        email:
          type: string
          format: email
          example: ali@example.com


    # -------------------------------------------------------
    # UPDATE REQUEST
    # -------------------------------------------------------

    UpdateEmployeeRequest:
      type: object
      required:
        - name
        - email

      properties:

        name:
          type: string
          example: Ali Ahmed

        email:
          type: string
          format: email
          example: ali.ahmed@example.com


    # -------------------------------------------------------
    # EMPLOYEE RESPONSE
    # -------------------------------------------------------

    EmployeeResponse:
      type: object

      properties:

        id:
          type: integer
          example: 1

        name:
          type: string
          example: Ali

        email:
          type: string
          format: email
          example: ali@example.com


    # -------------------------------------------------------
    # PAGINATION
    # -------------------------------------------------------

    Pagination:
      type: object

      properties:

        page:
          type: integer
          example: 1

        page_size:
          type: integer
          example: 10

        total:
          type: integer
          example: 3

        total_pages:
          type: integer
          example: 1


    # -------------------------------------------------------
    # EMPLOYEE LIST
    # -------------------------------------------------------

    EmployeeListResponse:
      type: object

      properties:

        data:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeResponse"

        pagination:
          $ref: "#/components/schemas/Pagination"


    # -------------------------------------------------------
    # ERROR
    # -------------------------------------------------------

    ErrorResponse:
      type: object

      properties:

        error:
          type: object

          properties:

            code:
              type: string
              example: EMPLOYEE_NOT_FOUND

            message:
              type: string
              example: employee not found


    # -------------------------------------------------------
    # HEALTH
    # -------------------------------------------------------

    HealthResponse:
      type: object

      properties:

        status:
          type: string
          example: ok